<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Woodstone Festival: First Dawn Interface</title>
  <link rel="stylesheet" href="css/accessibility.css">
</head>
<body>
  <header>
    <h1>Woodstone Festival: First Dawn Interface</h1>
    <button id="toggle-theme" aria-label="Toggle high contrast mode">🌗</button>
  </header>
  <main>
    <section id="landing">
      <img src="assets/woodstone_emblem.svg" alt="Woodstone Emblem: Sacred circular motif symbolizing presence, grounding, and harmony. 🌿">
      <div id="aria-live" aria-live="polite" style="position:absolute; left:-9999px;"></div>
    </section>
    <section id="harmonic-bridge">
      <canvas id="pulse-visualization" width="600" height="200" aria-label="Live pulse visualization"></canvas>
      <script src="js/harmonic_bridge_map.js"></script>
    </section>
  </main>
  <script>
    // Theme toggling for accessibility
    const btn = document.getElementById('toggle-theme');
    btn.onclick = () => {
      document.body.classList.toggle('high-contrast');
      btn.setAttribute('aria-pressed', document.body.classList.contains('high-contrast'));
    };
  </script>
</body>
</html>
